<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080808" />
    <title>WinPanel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-brand">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span class="brand-name">WinPanel</span>
      </div>
      <div class="boot-bar" role="progressbar" aria-label="Loading WinPanel"></div>
    </div>

    <div id="auth" class="auth" hidden></div>

    <div id="app" class="app" hidden>
      <aside id="sidebar" class="sidebar"></aside>
      <div class="workspace">
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open navigation">
          <span></span><span></span><span></span>
        </button>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <div id="modal-root" class="modal-root" hidden></div>
    <div id="toast-root" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
