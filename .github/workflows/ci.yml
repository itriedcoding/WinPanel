name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath clippy.log
          if ($LASTEXITCODE -ne 0) {
            $lines = @(Get-Content clippy.log)
            $blocks = New-Object System.Collections.Generic.List[string]
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(error|warning)(\[|:)') {
                $end = [Math]::Min($i + 14, $lines.Count - 1)
                $blocks.Add(($lines[$i..$end] -join "`n"))
              }
            }
            if ($blocks.Count -eq 0) { $blocks.Add(($lines | Select-Object -Last 40) -join "`n") }
            $text = ($blocks -join "`n---`n")
            if ($text.Length -gt 50000) { $text = $text.Substring(0, 50000) }
            $escaped = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::error title=Clippy failed::$escaped"
            exit 1
          }

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked
