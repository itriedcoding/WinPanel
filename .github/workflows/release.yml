name: Release

# Three ways to cut a release:
#   1. push a tag like v1.0.0,
#   2. push a branch named release/v1.0.0 (used when the tag cannot be pushed directly),
#   3. run this workflow manually from the Actions tab.
# The version is always read from Cargo.toml, and the release is published with that tag.

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          $version = $line.Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building WinPanel $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/winpanel.exe dist/WinPanel.exe
          "WinPanel ${{ steps.version.outputs.version }}" | Out-File -Encoding utf8 dist/VERSION.txt
          $hash = (Get-FileHash dist/WinPanel.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinPanel.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Item dist/WinPanel.exe | Select-Object Name, Length
          Get-Content dist/SHA256SUMS.txt

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "winpanel-smoke"
          $arguments = @("--data-dir", $dataDir, "--no-browser", "--listen", "127.0.0.1:18787")
          $process = Start-Process -FilePath "dist/WinPanel.exe" -ArgumentList $arguments -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP/winpanel.out" `
            -RedirectStandardError "$env:RUNNER_TEMP/winpanel.err"
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:18787/api/auth/status" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
          }
          if (-not $ready) {
            Get-Content "$env:RUNNER_TEMP/winpanel.out", "$env:RUNNER_TEMP/winpanel.err" -ErrorAction SilentlyContinue
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "WinPanel did not answer on 127.0.0.1:18787"
          }
          $status = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/auth/status"
          if (-not $status.version) { throw "Unexpected status payload: $($status | ConvertTo-Json -Compress)" }
          if ($status.version -ne "${{ steps.version.outputs.version }}") {
            throw "Executable reports version $($status.version), expected ${{ steps.version.outputs.version }}"
          }
          $index = Invoke-WebRequest -Uri "http://127.0.0.1:18787/" -UseBasicParsing
          if ($index.Content -notmatch "WinPanel") { throw "Embedded web interface was not served" }
          $css = Invoke-WebRequest -Uri "http://127.0.0.1:18787/css/app.css" -UseBasicParsing
          if ($css.Content.Length -lt 1000) { throw "Embedded stylesheet looks empty" }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed: WinPanel $($status.version)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: winpanel-windows-x64
          path: |
            dist/WinPanel.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WinPanel v${{ steps.version.outputs.version }}
          body: |
            Windows x64 build of WinPanel ${{ steps.version.outputs.version }}.

            Download `WinPanel.exe`, verify it against `SHA256SUMS.txt`, then run it.
            The interface opens at http://127.0.0.1:8787 and data is stored in
            `%APPDATA%\WinPanel`.

            See the README for requirements, remote access and troubleshooting.
          files: |
            dist/WinPanel.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
