name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/winpanel.exe dist/WinPanel.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "WinPanel $version" | Out-File -Encoding utf8 dist/VERSION.txt
          $hash = (Get-FileHash dist/WinPanel.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinPanel.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Item dist/WinPanel.exe | Select-Object Name, Length
          Get-Content dist/SHA256SUMS.txt

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "winpanel-smoke"
          $process = Start-Process -FilePath "dist/WinPanel.exe" `
            -ArgumentList "--data-dir", "`"$dataDir`"", "--no-browser", "--listen", "127.0.0.1:18787" `
            -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/winpanel.out" -RedirectStandardError "$env:RUNNER_TEMP/winpanel.err"
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:18787/api/auth/status" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
          }
          if (-not $ready) {
            Get-Content "$env:RUNNER_TEMP/winpanel.out", "$env:RUNNER_TEMP/winpanel.err" -ErrorAction SilentlyContinue
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "WinPanel did not answer on 127.0.0.1:18787"
          }
          $status = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/auth/status"
          if ($status.version.Length -eq 0) { throw "Unexpected status payload" }
          $index = Invoke-WebRequest -Uri "http://127.0.0.1:18787/" -UseBasicParsing
          if ($index.Content -notmatch "WinPanel") { throw "Embedded web interface was not served" }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed: $($status.version)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: winpanel-windows-x64
          path: |
            dist/WinPanel.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinPanel.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
